px}.main{margin-left:230px}.topbar{min-height:70px;border-bottom:1px solid var(--line);padding:16px 32px;display:flex;gap:16px;align-items:center;justify-content:space-between;background:white}.topbar input{max-width:320px}.main-content{padding:32px;max-width:1500px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;letter-spacing:.6px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;margin-bottom:20px;box-shadow:0 1px 2px #172c4c06}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.metric{font-size:29px;font-weight:750}.notice{background:#eff6ff;color:#234b89;border:1px solid #c5dbff;border-radius:9px;padding:13px 16px;margin:12px 0}.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}.error{background:#fff1f2;color:#9f1239;border:1px solid #fecdd3;border-radius:8px;padding:12px;margin:10px 0}.field-error{color:#b91c1c;font-size:12px;display:block}[aria-invalid=true]{border-color:#b91c1c}.tag{display:inline-block;border-radius:16px;background:#eff6ff;color:#1d4ed8;font-size:12px;padding:4px 10px;white-space:nowrap}.tag.ok{background:#ecfdf3;color:#166534}.tag.pending{background:#fff7ed;color:#9a3412}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{color:var(--muted);font-size:12px;background:#f8fafc}td,th{padding:14px 12px;border-bottom:1px solid var(--line);vertical-align:top}td{overflow-wrap:anywhere}tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:36px 16px}.row-button{border:0;background:none;text-align:left;padding:0;color:var(--blue);font-weight:700}.filters{display:flex;gap:14px;align-items:end;flex-wrap:wrap}.filters>div{flex:1;min-width:160px}.filters label{margin-top:0}.steps{display:flex;gap:12px;justify-content:space-between;color:var(--muted);font-size:12px;flex-wrap:wrap}.steps .current{color:var(--blue);font-weight:700}.ocr-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.preview{background:#edf1f7;min-height:350px;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:auto;padding:12px}.preview img{max-width:100%;max-height:680px;object-fit:contain}.preview object{width:100%;height:650px}.question{border:1px solid var(--line);padding:16px;border-radius:9px;margin:14px 0}.question.active{border-color:var(--blue)}.checks{display:flex;align-items:center;gap:9px;font-weight:400}.checks input{flex:none}.history{border-left:3px solid var(--line);padding-left:14px;margin:15px 0}.mono{font:12px/1.7 Consolas,monospace;overflow-wrap:anywhere}.queue{display:grid;gap:8px}.queue button{text-align:left}.queue .active{border-color:var(--blue);background:#eff6ff}.split{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px}.bar{height:12px;background:#e8eef8;border-radius:10px;overflow:hidden}.bar span{display:block;background:var(--blue);height:100%}dialog{border:0;border-radius:16px;padding:0;width:min(780px,calc(100% - 28px));max-height:90dvh;color:var(--ink);box-shadow:0 24px 80px #10243c40}dialog::backdrop{background:#14203470;backdrop-filter:blur(4px)}.dialog-head{padding:22px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;background:white;z-index:2}.dialog-body{padding:8px 26px 24px}.dialog-foot{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:16px 26px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#183350;color:white;padding:13px 22px;border-radius:10px;z-index:100;max-width:90vw}.ref-image{max-width:100%;max-height:200px}.divider{border:0;border-top <script>
'use strict';
const KEY='pixiaozhi.prototype.v2', $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(), now=()=>new Date().toISOString(), date=s=>s?new Date(s).toLocaleString('zh-CN'):'—', clone=v=>JSON.parse(JSON.stringify(v));
const subjects=['语文','数学','英语'], routes={workbench:'工作台',assignments:'作业管理',grading:'智能批改',rubrics:'评分标准',reports:'批改报告',settings:'设置'};
const paths={workbench:'m3 10 9-7 9 7v11H3zM9 21v-7h6v7',assignments:'m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5',grading:'M5 3h14v18H5zM8 12l3 3 5-6',rubrics:'M4 3h16v18H4zM8 7h8M8 11h8M8 15h5',reports:'M4 3v18h17M8 17v-4M13 17V7M18 17V10',settings:'M12 3v3M12 18v3M3 12h3M18 12h3M5 5l3 3M16 16l3 3M5 19l3-3M16 8l3-3M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0'};
function icon(k){return '<svg class="icon" aria-hidden="true"><path d="'+paths[k]+'"/></svg>'}
function seed(){return {version:2,revision:0,classes:[],rubrics:[],batches:[],settings:{teacher:'林老师'}}}
let state=seed(),loadBroken=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed.version!==2||!Array.isArray(parsed.batches)||!Array.isArray(parsed.classes)||!Array.isArray(parsed.rubrics))throw Error('不支持的数据版本');state=parsed}}catch(e){loadBroken=true;$('#storage-error').hidden=false;$('#storage-error').textContent='本地数据读取失败，已停止保存以保护原记录。请保留浏览器数据并联系开发者。'+e.message}
let page='workbench',batchId='',pageId='',studentId='',questionId='',reportMode='reviewed',queueFilter='all',search='',statusFilter='',subjectFilter='',modalDirty=false,viewDirty=false,uploadBusy=false,modalContext=null,returnFocus=null,previewUrl='',previewToken=0,toastTimer,dbPromise;
function isLoggedIn(){return sessionStorage.getItem('pixiaozhi.auth')==='1'||localStorage.getItem('pixiaozhi.remember')==='1'}
function showLogin(){document.body.classList.add('is-locked');$('#login-screen').hidden=false;setTimeout(()=>$('#login-email').focus(),0)}
function login(e){e.preventDefault();const email=$('#login-email').value.trim(),password=$('#login-password').value,box=$('#login-error');if(email!=='teacher@example.com'||password!=='123456'){box.hidden=false;box.textContent='账号或密码不正确，请使用页面显示的测试账号。';$('#login-password').setAttribute('aria-invalid','true');return}box.hidden=true;$('#login-password').removeAttribute('aria-invalid');sessionStorage.setItem('pixiaozhi.auth','1');if($('#remember-login').checked)localStorage.setItem('pixiaozhi.remember','1');document.body.classList.remove('is-locked');$('#login-screen').hidden=true;render();toast('登录成功')}
function logout(){if(viewDirty||modalDirty){if(!confirm('有尚未保存的修改，确定退出登录？'))return}closeDialog(true);sessionStorage.removeItem('pixiaozhi.auth');localStorage.removeItem('pixiaozhi.remember');document.body.classList.add('is-locked');$('#login-screen').hidden=false;$('#login-form').reset();showLogin();toast('已退出登录')}
function save(){if(loadBroken)return false;try{state.revision++;localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){$('#storage-error').hidden=false;$('#storage-error').textContent='保存失败：浏览器存储不可用或空间不足。当前修改仅在内存中，刷新会丢失。请释放空间后重试。';return false}}
function toast(t){clearTimeout(toastTimer);$('#toast').textContent=t;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4200)}
function db(){return dbPromise||(dbPromise=new Promise((resolve,reject)=>{const r=indexedDB.open('pixiaozhi-files-v2',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)}))}
async function blobStore(action,key,value){const d=await db();return new Promise((resolve,reject)=>{const tx=d.transaction('files',action==='get'?'readonly':'readwrite'),os=tx.objectStore('files'),r=action==='put'?os.put(value,key):action==='delete'?os.delete(key):os.get(key);let result;r.onsuccess=()=>result=r.result;tx.oncomplete=()=>resolve(result);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
const batch=()=>state.batches.find(b=>b.id===batchId), classroom=b=>state.classes.find(c=>c.id===b?.classId), roster=b=>classroom(b)?.students||[], student=(b,id)=>roster(b).find(s=>s.id===id), pagesFor=(b,sid)=>b.pages.filter(p=>p.studentId===sid).sort((a,z)=>a.sequence-z.sequence), gradeKey=(sid,qid)=>sid+':'+qid;
function answerFor(b,sid,qid){return pagesFor(b,sid).filter(p=>p.answers[qid]).map(p=>p.answers[qid].blank?'':p.answers[qid].text.trim()).filter(Boolean).join('\n')}
function members(b){return [...new Set(b.pages.map(p=>p.studentId).filter(Boolean))]}
function configErrors(b){const errors=[];if(!b.title.trim()||!classroom(b))errors.push('请补全批次名称和班级');if(!Number.isFinite(b.total)||b.total<=0)errors.push('批次总分须大于 0');if(!b.questions.length)errors.push('请配置至少一道题');if(Math.abs(b.questions.reduce((s,q)=>s+q.max,0)-b.total)>.001)errors.push('所有题目分值之和必须等于批次总分');for(const q of b.questions){if(!(q.max>0))errors.push('第 '+q.no+' 题分值无效');if(q.type==='objective'&&!q.answer.trim())errors.push('第 '+q.no+' 题缺少参考答案');if(q.type==='subjective'&&(!q.rubric||Math.abs(q.rubric.points.reduce((s,p)=>s+p.max,0)-q.max)>.001))errors.push('第 '+q.no+' 题须绑定同学科、分值一致的评分标准')}return errors}
function readiness(b,sid){const errors=[],ps=pagesFor(b,sid);if(!ps.length)return ['没有该学生的页面'];ps.forEach((p,i)=>{if(!p.confirmed)errors.push('页面 '+p.sequence+' 尚未确认归属与答案');if(p.sequence!==i+1)errors.push('页序重复或不连续，请从 1 开始');const f=b.files.find(f=>f.id===p.fileId);if(!f||f.status!=='success')errors.push('原文件尚未上传成功')});for(const q of b.questions){const found=ps.filter(p=>p.answers[q.id]);if(!found.length)errors.push('第 '+q.no+' 题未录入；空题也需明确确认');if(found.some(p=>!p.answers[q.id].text.trim()&&!p.answers[q.id].blank))errors.push('第 '+q.no+' 题为空且未确认空题')}for(const q of b.questions){const as=ps.map(p=>p.answers[q.id]).filter(Boolean);if(as.some(a=>a.blank)&&as.some(a=>a.text.trim()))errors.push('第 '+q.no+' 题跨页存在空题与有答案冲突')}return [...new Set(errors)]}
function status(b){if(b.draft)return '草稿';if(b.files.some(f=>f.status==='failed'))return '部分失败';if(!b.files.length)return '待上传';if(b.pages.some(p=>!p.studentId||!p.confirmed)||!members(b).length||members(b).some(s=>readiness(b,s).length))return '待校对';const expected=members(b).flatMap(s=>b.questions.map(q=>b.grades[gradeKey(s,q.id)]));if(expected.length&&expected.every(g=>g?.reviewed&&!g.stale))return '已复核';if(expected.some(g=>g&&!g.stale))return '待复核';return '待批改'}
function badge(t){return '<span class="tag '+(t==='已复核'?'ok':'pending')+'">'+esc(t)+'</span>'}
function button(label,action,id='',style=''){return '<button type="button" class="'+style+'" data-action="'+action+'" data-id="'+esc(id)+'">'+label+'</button>'}
function empty(t){return '<div class="empty">'+t+'</div>'}
function options(items,selected){return items.map(([v,t])=>'<option value="'+esc(v)+'"'+(String(v)===String(selected)?' selected':'')+'>'+esc(t)+'</option>').join('')}
function field(id,label,value='',type='text',extra=''){return '<label for="'+id+'">'+label+'</label><input id="'+id+'" type="'+type+'" value="'+esc(value)+'" '+extra+'>'}
function area(id,label,value='',extra=''){return '<label for="'+id+'">'+label+'</label><textarea id="'+id+'" '+extra+'>'+esc(value)+'</textarea>'}
function select(id,label,items,value){return '<label for="'+id+'">'+label+'</label><select id="'+id+'">'+options(items,value)+'</select>'}
function head(title,sub,actions=''){return '<div class="head"><div><div class="eyebrow">'+esc(routes[page]||'作业管理 · OCR 校对')+'</div><h1>'+esc(title)+'</h1><p class="muted">'+sub+'</p></div><div class="actions">'+actions+'</div></div>'}
function steps(n){return '<div class="card steps">'+['批次配置','上传采集','OCR 校对','智能批改','教师复核'].map((s,i)=>'<span class="'+(i===n?'current':'')+'">'+(i+1)+' · '+s+'</span>').join('')+'</div>'}
function errorBox(errors){return '<div class="error" role="alert">'+errors.map(esc).join('<br>')+'</div>'}
function fail(form,errors){let box=form.querySelector('.form-errors');if(!box){box=document.createElement('div');box.className='form-errors error';box.setAttribute('role','alert');box.tabIndex=-1;form.prepend(box)}form.querySelectorAll('[aria-invalid]').forEach(e=>e.removeAttribute('aria-invalid'));form.querySelectorAll('.field-error').forEach(e=>e.remove());box.innerHTML='<strong>请检查以下内容</strong><br>'+errors.map(([id,text])=>{const el=document.getElementById(id);if(el){el.setAttribute('aria-invalid','true');el.setAttribute('aria-describedby',id+'-error');el.insertAdjacentHTML('afterend','<small class="field-error" id="'+id+'-error">'+esc(text)+'</small>')}return '<a href="#'+id+'">'+esc(text)+'</a>'}).join('<br>');box.focus()}
function invalidate(b,sid,qid,reason){Object.entries(b.grades).forEach(([key,g])=>{if((!sid||g.studentId===sid)&&(!qid||g.questionId===qid)){g.stale=true;g.reviewed=false;g.history.push({time:now(),action:reason,teacher:state.settings.teacher})}})}

function drawBatchForm(){const m=modalContext,b=m.model,old=state.batches.find(x=>x.id===b.id);const classes=state.classes.filter(c=>c.active||c.id===b.classId);openDialog(old?'编辑批次':'创建作业批次','<form id="batch-form"><div class="notice">保存草稿允许稍后补齐答案；“保存并进入上传”会保存当前配置并继续下一步。批改前必须通过完整配置检查。</div>'+(!classes.length?'<div class="error">尚未创建班级，请关闭弹窗后点击“管理班级与学生”。</div>':'')+field('b-title','批次名称 *',b.title,'text','maxlength="100" required')+'<div class="grid"><div>'+select('b-class','班级 *',[['','请选择班级'],...classes.map(c=>[c.id,c.name])],b.classId)+'</div><div>'+select('b-subject','学科 *',subjects.map(s=>[s,s]),b.subject)+'</div></div>'+field('b-total','批次总分 *',b.total,'number','min="0.5" step="0.5" required')+'<h3>按题号配置参考答案与评分标准</h3><p class="muted">主观题参考答案是教师评分依据；学生答案在上传后通过 OCR 校对 / 人工录入。</p>'+b.questions.map((q,i)=>'<div class="question"><div class="grid"><div>'+field('q-no-'+i,'题号 *',q.no,'text','required maxlength="20"')+'</div><div>'+select('q-type-'+i,'题型',[['objective','客观题（精确匹配）'],['subjective','主观题（评分标准）']],q.type)+'</div><div>'+field('q-max-'+i,'单题分值 *',q.max,'number','min="0.5" step="0.5" required')+'</div><div>'+select('q-rubric-'+i,'主观题评分标准',[['','待配置'],...state.rubrics.filter(r=>r.active&&r.subject===b.subject).map(r=>[r.id,r.name+' · v'+r.version+' · '+r.total+'分']),...(q.rubric&&!state.rubrics.some(r=>r.id===q.rubric.id&&r.active&&r.subject===b.subject)?[[q.rubric.id,q.rubric.name+' · 已绑定 v'+q.rubric.version]]:[])],q.rubric?.id||'')+'</div></div>'+area('q-answer-'+i,'参考答案'+(q.type==='objective'?'（多个等价答案用 | 分隔）':' / 示例作答（可选）'),q.answer)+'<div class="actions">'+button('移除此题','remove-question',q.id)+(q.rubric?'<small>当前绑定 v'+q.rubric.version+'，评分点：'+esc(q.rubric.points.map(p=>p.label+' '+p.max+'分').join('；'))+'</small>':'')+'</div></div>').join('')+button('添加题目','add-question')+'<hr class="divider"><h3>参考答案图片</h3><label for="reference-file">添加 JPG / PNG 图片（原型仅预览；文字需人工核对录入上方各题）</label><input id="reference-file" type="file" accept=".jpg,.jpeg,.png,image/jpeg,image/p async function previewReference(key){const target=$('#reference-preview');try{const blob=await blobStore('get',key);if(blob&&target?.isConnected){const url=URL.createObjectURL(blob);target.innerHTML='<img class="ref-image" alt="参考答案原图">';target.querySelector('img').src=url;target.querySelector('img').onload=()=>URL.revokeObjectURL(url)}}catch(e){if(target?.isConnected)target.textContent='原图片无法读取，请重新选择'}}
function saveBatch(e){e.preventDefault();captureBatch();const b=modalContext.model,old=state.batches.find(x=>x.id===b.id),errors=[];if(!b.title)errors.push(['b-title','请输入批次名称']);if(!b.classId)errors.push(['b-class','请选择班级']);if(!(b.total>0))errors.push(['b-total','批次总分必须大于 0']);const nos=b.questions.map(q=>q.no);if(new Set(nos).size!==nos.length)errors.push(['q-no-0','题号不可重复']);b.questions.forEach((q,i)=>{if(!q.no||!(q.max>0))errors.push(['q-no-'+i,'请填写有效题号和分值']);if(q.rubric&&q.rubric.subject!==b.subject)errors.push(['q-rubric-'+i,'评分标准学科不匹配，请重新选择'])});if(errors.length)return fail(e.target,errors);const draft=e.submitter?.value==='draft';if(old){const changed=new Set([...old.questions,...b.questions].filter(q=>JSON.stringify(old.questions.find(z=>z.id===q.id))!==JSON.stringify(b.questions.find(z=>z.id===q.id))).map(q=>q.id));b.grades=old.grades;b.pages=old.pages;b.files=old.files;changed.forEach(qid=>invalidate(b,null,qid,'题目配置修改，需重新校对 / 批改'));if(changed.size)b.pages.forEach(p=>p.confirmed=false)}b.draft=draft&&!b.files.length;b.updated=now();if(old)Object.assign(old,b);else state.batches.unshift(b);batchId=b.id;if(save()){closeDialog(true);render();if(!draft)openUpload(b.id);else toast('草稿已保存，可点击批次重新编辑')}}

function openRubric(id=''){const r=state.rubrics.find(r=>r.id===id);openDialog(r?'编辑评分标准':'创建评分标准','<form id="rubric-form">'+field('r-name','标准名称 *',r?.name||'','text','required maxlength="100"')+'<div class="grid"><div>'+select('r-subject','学科',subjects.map(s=>[s,s]),r?.subject||'英语')+'</div><div>'+field('r-type','主观题型 *',r?.type||'简答题','text','required')+'</div></div>'+field('r-total','题目总分 *',r?.total||15,'number','min="0.5" step="0.5" required')+area('r-points','评分点：每行“名称|分值” *',r?.points.map(p=>p.label+'|'+p.max).join('\n')||'内容完整|6\n表达准确|6\n结构清晰|3','required')+area('r-example','示例作答及评分说明',r?.example||'')+'<p class="muted">评分点合计必须等于题目总分。修改后版本递增，相关结果标记为待重批；其他题目不受影响。</p><button type="submit" class="primary">保存标准</button></form>');modalContext={kind:'rubric',id};if(r&&state.batches.some(b=>b.questions.some(q=>q.rubric?.id===r.id)))$('#r-subject').disabled=true}
function saveRubric(e){e.preventDefault();const name=$('#r-name').value.trim(),subject=$('#r-subject').value,type=$('#r-type').value.trim(),total=Number($('#r-total').value),lines=$('#r-points').value.split('\n').filter(l=>l.trim()),points=lines.map(l=>{const a=l.split('|');return {label:a[0].trim(),max:a.length===2?Number(a[1]):NaN}}),errors=[];if(!name)errors.push(['r-name','请输入标准名称']);if(!type)errors.push(['r-type','请输入题型']);if(!(total>0))errors.push(['r-total','总分必须大于 0']);if(!points.length||points.some(p=>!p.label||!(p.max>0))||Math.abs(points.reduce((s,p)=>s+p.max,0)-total)>.001)errors.push(['r-points','评分点需按“名称|分值”填写，且合计等于总分']);if(errors.length)return fail(e.target,errors);const old=state.rubrics.find(r=>r.id===modalContext.id),r={id:old?.id||uid(),name,subject,type,total,points,example:$('#r-example').value.trim(),active:old?.active??true,version:(old?.version||0)+1,history:old?[...old.history,{...clone(old),history:undefined,time:now()}]:[]};if(old)Object.assign(old,r);else state.rubrics.unshift(r);state.batches.forEach(b=>b.questions.forEach(q=>{if(q.rubric?.id===r.id){q.rubric=clone({...r,history:[]});invalidate(b,null,q.id,'评分标准更新为 v'+r.version)}}));if(save()){closeDialog(true);render();toast('评分标准已保存，受影响结果已标记待重批')}}

async function validFile(file,reference=false){const ext=file.name.split('.').pop().toLowerCase();if(!['jpg','jpeg','png',...(reference?[]:['pdf'])].includes(ext))return '格式不支持，仅接受 JPG、PNG'+(reference?'':'、PDF');if(!file.size)return '文件为空';if(file.size>20*1024*1024)return '超过原型 20 MB 单文件限制';const bytes=new Uint8Array(await file.slice(0,8).arrayBuffer());const png=bytes[0]===137&&bytes[1]===80&&bytes[2]===78&&bytes[3]===71&&bytes[4]===13&&bytes[5]===10&&bytes[6]===26&&bytes[7]===10,jpg=bytes[0]===255&&bytes[1]===216&&bytes[2]===255,pdf=String.fromCharCode(...bytes.slice(0,5))==='%PDF-';if(!((ext==='png'&&png)||(['jpg','jpeg'].includes(ext)&&jpg)||(ext==='pdf'&&pdf)))return '文件内容与扩展名不符或文件已损坏';if(ext!=='pdf'){const valid=await new Promise(resolve=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);resolve(img.naturalWidth>0)};img.onerror=()=>{URL.revokeObjectURL(url);resolve(false)};img.src=url});if(!valid)return '图片无法解码，请选择完整有效的图片'}return ''}

async function upload(files,retryId){const b=state.batches.find(b=>b.id===modalContext?.id);if(!b||uploadBusy)return;if(files.length>50){toast('单次最多 50 个文件，请分批上传');return}uploadBusy=true;$('#upload-batch').disabled=true;$('#upload-files').disabled=true;try{for(const file of files){let f=retryId?b.files.find(f=>f.id===retryId):null;if(!f){f={id:uid(),name:file.name,size:file.size,modified:file.lastModified,type:file.name.toLowerCase().endsWith('.pdf')?'application/pdf':file.type||'image/jpeg',status:'saving',created:now()};b.files.push(f)}else Object.assign(f,{name:file.name,size:file.size,modified:file.lastModified,type:file.name.toLowerCase().endsWith('.pdf')?'application/pdf':file.type||'image/jpeg',status:'saving'});renderUploadResults();const error=await validFile(file);try{if(error)throw Error(error);const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',await file.arrayBuffer()))).map(n=>n.toString(16).padStart(2,'0')).join('');if(b.files.some(x=>x.id!==f.id&&x.status==='success'&&x.hash===hash&&x.name===file.name)){if(retryId)throw Error('该文件内容已存在，请核对后选择其他文件');b.files=b.files.filter(x=>x.id!==f.id);toast('已跳过相同内容的重复文件：'+file.name);continue}f.hash=hash;await blobStore('put',f.id,file);f.status='success';f.error='';if(!b.pages.some(p=>p.fileId===f.id))b.pages.push({id:uid(),fileId:f.id,pageIndex:1,sequence:1,studentId:'',confirmed:false,groupingReason:'待教师确认，未进行真实识别',groupingConfidence:null,answers:{},history:[]})}catch(e){f.status='failed';f.error=e.message}b.updated=now();b.draft=false;save();renderUploadResults()}}finally{uploadBusy=false;$('#upload-batch').disabled=false;$('#upload-files').disabled=false;$('#upload-files').value='';renderUploadResults();render();toast('上传处理完成，请查看逐文件结果')}}

async function loadPreview(){const token=previewToken,b=batch(),p=b?.pages.find(p=>p.id===pageId),f=b?.files.find(f=>f.id===p?.fileId),target=$('#original-preview');if(!f||!target)return;try{const blob=await blobStore('get',f.id);if(token!==previewToken||!target.isConnected)return;if(!blob){target.innerHTML='<div class="error">找不到原文件。浏览器数据可能已清理，请重新上传对应文件。'+button('补充上传','upload',b.id)+'</div>';return}previewUrl=URL.createObjectURL(blob);if(f.type==='application/pdf'){target.innerHTML='<object type="application/pdf" aria-label="作业 PDF"><p>浏览器不支持内嵌预览。<a target="_blank" rel="noopener">打开原文件</a></p></object>';target.querySelector('object').data=previewUrl+'#page='+p.pageIndex;target.querySelector('a').href=previewUrl}else{const img=document.createElement('img');img.alt=f.name+' 作业原图';img.src=previewUrl;img.onerror=()=>target.textContent='图片无法解码，请核实文件是否损坏并重新上传。';target.replaceChildren(img)}}catch(e){if(target.isConnected)target.textContent='本地原文件读取失败：'+e.message}}
function saveOcr(e){e.preventDefault();const b=batch(),p=b.pages.find(p=>p.id===pageId),sid=$('#ocr-student').value,sequence=Number($('#ocr-sequence').value),answers={},errors=[],confirmed=e.submitter?.value==='confirm';if(confirmed&&!sid)errors.push(['ocr-student','请选择所属学生']);if(!Number.isInteger(sequence)||sequence<1)errors.push(['ocr-sequence','页序必须为正整数']);if(sid&&b.pages.some(x=>x.id!==p.id&&x.studentId===sid&&x.sequence===sequence))errors.push(['ocr-sequence','该学生已有此页序，请核对归属或调整页序']);b.questions.forEach((q,i)=>{if($('#a-present-'+i).checked){const text=$('#a-text-'+i).value.trim(),blank=$('#a-blank-'+i).checked;if(confirmed&&!text&&!blank)errors.push(['a-text-'+i,'第 '+q.no+' 题须录入答案或明确确认空题']);if(text&&blank)errors.push(['a-text-'+i,'第 '+q.no+' 题已有文字，不能同时确认未作答']);answers[q.id]={text,blank,source:'manual',confidence:null}}});if(confirmed&&!Object.keys(answers).length)errors.push(['a-present-0','请至少标记本页包含的一道题']);if(errors.length)return fail(e.target,errors);const previous={studentId:p.studentId,sequence:p.sequence,answers:clone(p.answers),confirmed:p.confirmed},groupChanged=p.studentId!==sid||p.sequence!==sequence;if(groupChanged){if(p.studentId)invalidate(b,p.studentId,null,'页面归属或顺序调整');if(sid)invalidate(b,sid,null,'页面归属或顺序调整')}else b.questions.forEach(q=>{if(JSON.stringify(p.answers[q.id])!==JSON.stringify(answers[q.id]))invalidate(b,sid,q.id,'学生作答经人工校对修改')});p.history.push({time:now(),teacher:state.settings.teacher,before:previous,after:{studentId:sid,sequence,answers:clone(answers),confirmed}});Object.assign(p,{studentId:sid,sequence,answers,confirmed,groupingReason:'教师手动确认',groupingConfidence:null});b.updated=now();viewDirty=false;if(save()){render();toast(confirmed?'本页校对已确认':'校对草稿已保存')}}
function openPdf(id){const b=batch(),count=b.pages.filter(p=>p.fileId===id).length;openDialog('设置 PDF 页面数','<form id="pdf-form">'+field('pdf-count','PDF 实际总页数',count,'number','min="1" max="100" step="1" required')+'<p class="muted">原型不会自动读取页数，请对照 PDF 输入。增加页面后逐页分配学生及答案；不能删除已有校对内容的页面。</p><button class="primary" type="submit">确认页面数</button></form>');modalContext={kind:'pdf',id}}

function renderGrading(){const b=batch();let html=head('评分与教师复核','客观题按规则判分；主观题仅模拟评分。必须经教师确认后才计入正式成绩。')+'<section class="card filters"><div>'+chooseBatchControl('grade-batch')+'</div>'+(b?button('返回本批次校对','ocr-open',b.id)+button('运行 / 补齐初评','run-grade',b.id,'primary'):'')+'</section>';if(!b)return html+'<div class="card">'+empty('请选择批次，或先到作业管理创建批次并上传。')+'</div>';const errors=configErrors(b);if(errors.length)html+=errorBox(errors)+button('补全批次配置','batch-edit',b.id);if(!b.pages.length)return html+empty('该批次还没有上传作业。');const pending=b.pages.filter(p=>!p.studentId||!p.confirmed).length;if(pending)html+='<div class="notice warn">'+pending+' 页未确认，相关学生不能开始批改。'+button('去校对','ocr-open',b.id)+'</div>';let entries=members(b).flatMap(sid=>b.questions.map(q=>({sid,q,g:b.grades[gradeKey(sid,q.id)]})));if(queueFilter==='pending')entries=entries.filter(x=>!x.g?.reviewed||x.g?.stale);if(queueFilter==='reviewed')entries=entries.filter(x=>x.g?.reviewed&&!x.g?.stale);let current=entries.find(x=>x.sid===studentId&&x.q.id===questionId)||entries[0];if(current){studentId=current.sid;questionId=current.q.id}html+='<div class="split"><aside class="card">'+select('queue-filter','题目队列',[['all','全部题目'],['pending','待处理'],['reviewed','已复核']],queueFilter)+'<div class="queue">'+entries.map(x=>button(esc(student(b,x.sid)?.name||'未知学生')+' · 第 '+esc(x.q.no)+' 题<br><small>'+(!x.g?'未初评':x.g.stale?'配置已变更，待重批':x.g.reviewed?'已复核 '+x.g.score+'分':'待复核 '+x.g.suggested+'分')+'</small>','grade-select',x.sid+'|'+x.q.id,x===current?'active':'')).join('')+'</div></aside><section class="card">'+(current?gradeDetail(b,current):empty('当前筛选下没有题目。'))+'</section></div>';return html}
function gradeDetail(b,{sid,q,g}){const errors=readiness(b,sid),s=student(b,sid);return '<h2>'+esc(s?.name)+' · '+esc(s?.code)+' · 第 '+esc(q.no)+' 题</h2><p>'+esc(b.title)+' · '+(q.type==='objective'?'客观题 / 规则判分':'主观题 / 模拟评分')+'</p><div class="actions">'+button('查看原图 / 校对','grade-source',sid)+button('历史记录','grade-history',gradeKey(sid,q.id))+button('仅重跑本题','rerun',gradeKey(sid,q.id))+'</div>'+(errors.length?errorBox(errors):'')+'<h3>学生作答（按页序拼接）</h3><pre>'+esc(answerFor(b,sid,q.id)||'已明确确认未作答 / 尚未录入，请核对页面状态')+'</pre><h3>参考答案 / 评分依据</h3><pre>'+esc(q.answer||q.rubric?.example||'未提供示例')+'</pre>'+(q.rubric?'<p>标准：'+esc(q.rubric.name)+' · v'+q.rubric.version+' · '+esc(q.rubric.points.map(p=>p.label+' '+p.max+'分').join('；'))+'</p>':'')+(!g?'<div class="notice">尚未生成初评。补齐配置和校对后，点击“运行 / 补齐初评”。</div>':g.stale?'<div class="notice warn">本题输入或评分依据已修改，旧结果不计入报告。请重新校对并重跑本题。</div>':'<div class="notice '+(g.simulated?'warn':'')+'">'+(g.simulated?'模拟主观评分，不代表真实模型判断。':'规则版本 exact-normalized-v1：NFKC / 忽略大小写和空白 / 多答案逐一匹配。')+'<br>初评建议：'+g.suggested+' / '+q.max+' 分<br>'+esc(g.reason)+'</div><form id="grade-form">'+(q.type==='subjective'?g.points.map((p,i)=>'<div class="question">'+field('g-point-'+i,esc(p.label)+'（满分 '+p.max+'）',g.reviewPoints?.[i]??p.score,'number','min="0" max="'+p.max+'" step="0.5" required')+'<small>依据：'+esc(p.evidence)+'；'+esc(p.reason)+'</small></div>').join(''):field('g-score','教师评分（0–'+q.max+'）',g.score??g.suggested,'number','min="0" max="'+q.max+'" step="0.5" required'))+area('g-feedback','评语 *',g.feedback,'required')+area('g-reason','修改原因（调整分数、评语或重新复核时必填）','')+'<div class="actions"><button type="submit" name="mode" value="draft">保存待复核</button><button type="submit" name="mode" value="confirm" class="primary">确认本题并查看下一题</button></div><p>'+badge(g.reviewed?'已复核':'待复核')+' · '+esc(g.teacher||'尚未确认')+' · '+date(g.reviewTime)+'</p></form>')}
function produceGrade(b,sid,q){const text=answerFor(b,sid,q.id),old=b.grades[gradeKey(sid,q.id)],objective=q.type==='objective',norm=s=>s.normalize('NFKC').replace(/\s/g,'').toUpperCase(),matched=objective&&!!text&&q.answer.split('|').some(a=>norm(a)===norm(text));const points=objective?[]:q.rubric.points.map(p=>({label:p.label,max:p.max,score:text?Math.floor(p.max*.7*2)/2:0,evidence:text?'作答节选：“'+text.slice(0,50)+'”':'教师已确认未作答',reason:'演示分值，未进行语义判断，请教师逐项核实'})),suggested=objective?(matched?q.max:0):points.reduce((s,p)=>s+p.score,0),reason=objective?(matched?'与参考答案匹配':'未匹配参考答案，请教师检查格式或答案有效性'):'按评分点生成演示结果，非真实 AI 评分';return {studentId:sid,questionId:q.id,suggested,score:suggested,reason,points,feedback:objective?(matched?'答案正确。':'请对照参考答案订正。'):'请教师核实评分点，补充具体改进建议。',simulated:!objective,reviewed:false,stale:false,created:now(),input:text,reference:q.answer,rubric:clone(q.rubric),history:[...(old?.history||[]),...(old?[{time:now(),action:'重新初评',before:{score:old.score,reviewed:old.reviewed,feedback:old.feedback,rubric:old.rubric}}]:[])]}}
function runGrade(onlyKey){const b=batch(),errors=configErrors(b);if(errors.length){openDialog('批次配置尚未完成',errorBox(errors),button('关闭','close'));return}let done=0,blocked=[];members(b).forEach(sid=>{const ready=readiness(b,sid);if(ready.length){blocked.push(student(b,sid)?.name+'：'+ready.join('；'));return}b.questions.forEach(q=>{const key=gradeKey(sid,q.id),old=b.grades[key];if(onlyKey&&key!==onlyKey)return;if(!onlyKey&&old&&!old.stale)return;if(onlyKey&&old?.reviewed&&!confirm('重跑会撤销本题已复核状态，保留历史并重新等待复核。确定继续？'))return;b.grades[key]=produceGrade(b,sid,q);done++})});if(save()){render();toast('已生成 '+done+' 道题的初评；已有有效结果未被覆盖');if(blocked.length)openDialog('部分学生尚未满足批改条件',errorBox(blocked))}}
function saveGrade(e){e.preventDefault();const b=batch(),q=b.questions.find(q=>q.id===questionId),g=b.grades[gradeKey(studentId,questionId)],errors=[],pointScores=q.type==='subjective'?g.points.map((p,i)=>Number($('#g-point-'+i).value)):null,score=pointScores?pointScores.reduce((s,v)=>s+v,0):Number($('#g-score').value),feedback=$('#g-feedback').value.trim(),reason=$('#g-reason').value.trim(),confirmed=e.submitter?.value==='confirm';if(!Number.isFinite(score)||score<0||score>q.max)errors.push([q.type==='subjective'?'g-point-0':'g-score','分数必须在 0–'+q.max+' 之间']);if(pointScores)pointScores.forEach((v,i)=>{if(!Number.isFinite(v)||v<0||v>g.points[i].max)errors.push(['g-point-'+i,'评分点分值超出允许范围'])});if(!feedback)errors.push(['g-feedback','请填写评语']);if((score!==g.suggested||feedback!==g.feedback||g.reviewed)&&!reason)errors.push(['g-reason','调整分数 / 评语或重新复核时，请填写原因']);if(g.stale||readiness(b,studentId).length||configErrors(b).length)errors.push(['g-reason','数据已变更，请重新校对和初评']);if(errors.length)return fail(e.target,errors);g.history.push({time:now(),teacher:state.settings.teacher,action:confirmed?'教师确认':'保存待复核',before:{score:g.score,feedback:g.feedback,reviewed:g.reviewed,points:g.reviewPoints},after:{score,feedback,reviewed:confirmed,points:pointScores},reason:reason||'确认初评结果'});Object.assign(g,{score,feedback,reviewPoints:pointScores,reviewed:confirmed,teacher:state.settings.teacher,reviewTime:confirmed?now():null});viewDirty=false;if(save()){if(confirmed){const next=members(b).flatMap(s=>b.questions.map(q=>({s,q,g:b.grades[gradeKey(s,q.id)]}))).find(x=>x.g&&!x.g.stale&&!x.g.reviewed);if(next){studentId=next.s;questionId=next.q.id}}render();toast(confirmed?'本题已复核，报告同步更新':'已保存，尚未进入正式成绩')}}
function renderReports(){const b=batch();let html=head('批改报告','学生整份作业全部题目完成复核后，才计入正式总分与班级统计。')+'<section class="card filters"><div>'+chooseBatchControl('report-batch')+'</div><div>'+select('report-mode','统计口径',[['reviewed','教师已复核（正式成绩）'],['ai','初评建议（非正式成绩）']],reportMode)+'</div></section>';if(!b)return html+'<div class="card">'+empty('请选择批次查看报告。')+'</div>';const rows=members(b).map(sid=>{const gs=b.questions.map(q=>b.grades[gradeKey(sid,q.id)]),ready=!readiness(b,sid).length&&!configErrors(b).length,complete=ready&&gs.length&&gs.every(g=>g&&!g.stale&&(reportMode==='ai'||g.reviewed));return {sid,complete,total:complete?gs.reduce((s,g)=>s+(reportMode==='ai'?g.suggested:g.score),0):null,reviewed:gs.filter(g=>g?.reviewed&&!g.stale).length}}),valid=rows.filter(r=>r.complete),avg=valid.length?(valid.reduce((s,r)=>s+r.total,0)/valid.length).toFixed(1):'—',ranges=[['90%–100%',.9,1.01],['80%–89%',.8,.9],['60%–79%',.6,.8],['低于 60%',0,.6]];html+='<div class="notice '+(reportMode==='ai'?'warn':'')+'">范围：'+esc(b.title)+' · '+esc(classroom(b)?.name)+' · '+(reportMode==='ai'?'含主观题模拟建议，不是正式成绩':'仅完整已复核作业')+'<br>当前统计时间：'+date(now())+'；待确认归属页面 '+b.pages.filter(p=>!p.studentId).length+' 页，不计入学生成绩。</div><div class="metrics">'+[['可统计学生',valid.length+' / '+rows.length],['平均分',avg],['最高分',valid.length?Math.max(...valid.map(r=>r.total)):'—'],['批次满分',b.total]].map(([k,v])=>'<div class="card"><small>'+k+'</small><div class="metric">'+v+'</div></div>').join('')+'</div><div class="grid"><section class="card"><h2>得分分布</h2>'+(valid.length?ranges.map(([label,min,max])=>{const n=valid.filter(r=>r.total/b.total>=min&&r.total/b.total<max).length;return '<p>'+label+' · '+n+' 人</p><div class="bar" aria-label="'+label+' '+n+'人"><span style="width:'+(n/valid.length*100)+'%"></span></div>'}).join(''):empty('暂无符合当前口径的完整成绩。'))+'</section><section class="card"><h2>按题目查看失分</h2>'+(valid.length?b.questions.map(q=>{const lost=valid.filter(r=>{const g=b.grades[gradeKey(r.sid,q.id)];return (reportMode==='ai'?g.suggested:g.score)<q.max}).length;return '<p>第 '+esc(q.no)+' 题：'+lost+' / '+valid.length+' 人未满分（'+Math.round(lost/valid.length*100)+'%）</p>'}).join(''):'<p class="muted">有完整成绩后生成。未接入知识点标注，不推断虚构薄弱知识点。</p>')+'</section></div><section class="card"><h2>学生成绩明细</h2><div class="table-wrap"><table><thead><tr><th>学生</th><th>已复核题数</th><th>总分</th><th>详情</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+esc(student(b,r.sid)?.name)+' · '+esc(student(b,r.sid)?.code)+'</td><td>'+r.reviewed+' / '+b.questions.length+'</td><td>'+(r.complete?r.total:'未完成，不计总分')+'</td><td>'+button('查看逐题结果','student-report',r.sid)+'</td></tr>').join('')+'</tbody></table></div>'+(rows.length?'':empty('暂无已分配学生的作业。'))+'</section><p class="muted">报告导出格式与实现按 PRD 留待最终交付。</p>';return html}
function studentReport(sid){const b=batch();openDialog((student(b,sid)?.name||'学生')+' · 逐题结果','<p>'+esc(b.title)+'</p>'+b.questions.map(q=>{const g=b.grades[gradeKey(sid,q.id)];return '<div class="question"><h3>第 '+esc(q.no)+' 题 / '+q.max+' 分</h3><p>'+(!g?'尚未初评':g.stale?'结果已失效，待重批':(g.reviewed?'教师复核 '+g.score:'待复核，初评建议 '+g.suggested)+' 分')+'</p><p>'+esc(g?.feedback||'')+'</p>'+button('查看原图与评分','report-to-grade',sid+'|'+q.id)+'</div>'}).join(''))}
async function loadDemo(){if(state.batches.some(b=>b.demo)){toast('演示批次已存在，请到作业管理查看');return}const sid=uid(),cid=uid(),rid=uid(),bid=uid(),fid=uid(),qid=uid(),sqid=uid();const c={id:cid,name:'演示班级（虚构数据）',active:true,students:[{id:sid,code:'DEMO001',name:'演示学生'}]},r={id:rid,name:'演示简答题评分标准',subject:'英语',type:'简答题',total:15,version:1,active:true,points:[{label:'内容完整',max:6},{label:'表达准确',max:6},{label:'结构清晰',max:3}],example:'Helping others makes us happy.',history:[]},svg='<svg xmlns="http://www.w3.org/2000/svg" width="700" height="900"><rect width="700" height="900" fill="white"/><g fill="#1e293b" font-family="Arial" font-size="22"><text x="50" y="80">DEMO ONLY - fictional worksheet</text><text x="50" y="140">Student: DEMO001</text><text x="50" y="240">1. Choose an answer: A / B / C</text><text x="50" y="290">Answer: A</text><text x="50" y="400">2. Why do you help others?</text><text x="50" y="450">Helping others makes us happy.</text></g></svg>';try{await blobStore('put',fid,new Blob([svg],{type:'image/svg+xml'}))}catch(e){toast('演示文件保存失败：'+e.message);return}state.classes.push(c);state.rubrics.push(r);state.batches.unshift({id:bid,demo:true,title:'英语练习 · 演示数据',classId:cid,subject:'英语',total:20,draft:false,updated:now(),questions:[{id:qid,no:'1',type:'objective',max:5,answer:'A',rubric:null},{id:sqid,no:'2',type:'subjective',max:15,answer:r.example,rubric:clone(r)}],files:[{id:fid,name:'DEMO001_虚构作业.svg',size:svg.length,type:'image/svg+xml',modified:0,status:'success',created:now()}],pages:[{id:uid(),fileId:fid,pageIndex:1,sequence:1,studentId:sid,confirmed:false,groupingReason:'演示样例，待教师确认',groupingConfidence:null,answers:{[qid]:{text:'A',blank:false,source:'demo',confidence:null},[sqid]:{text:r.example,blank:false,source:'demo',confidence:null}},history:[]}],grades:{}});if(save()){navigate('assignments',bid);toast('已添加明确标注的虚构演示数据，请先校对')}}
function syncSidebar(){const hidden=innerWidth<=700&&!$('#sidebar').classList.contains('open');$('#sidebar').inert=hidden;$('#sidebar').setAttribute('aria-hidden',String(hidden));$$('[data-action="menu"]').forEach(b=>b.setAttribute('aria-expanded',String(!hidden)))}window.addEventListener('resize',syncSidebar);
document.addEventListener('click',async e=>{if(!isLoggedIn())return;const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action,id=el.dataset.id;try{
if(a==='logout'){logout();return}else if(a==='menu'){$('#sidebar').classList.toggle('open');syncSidebar();if($('#sidebar').classList.contains('open'))$('#nav button').focus();else $('.topbar .mobile-menu').focus()}
else if(a==='nav')navigate(id);
else if(a==='close')closeDialog();
else if(a==='demo')await loadDemo();
else if(a==='classes'||a==='class-edit'){if(!$('#dialog').open||closeDialog())openClasses(id)}
else if(a==='batch-edit'){if(leaveView())openBatch(id)}
else if(a==='batch-open'){const b=state.batches.find(b=>b.id===id);if(b.draft||!b.files.length)openBatch(id);else navigate(['已复核','待复核','待批改'].includes(status(b))?'grading':'ocr',id)}
else if(a==='upload'){if(leaveView())openUpload(id)}
else if(a==='records')records();
else if(a==='reset-search'){search='';statusFilter='';subjectFilter='';render()}
else if(a==='add-question'){captureBatch();const q=defaultQuestion();q.no=String(modalContext.model.questions.length+1);q.max=1;modalContext.model.questions.push(q);drawBatchForm();modalDirty=true}
else if(a==='remove-question'){captureBatch();if(modalContext.model.questions.length===1){toast('至少保留一道题');return}if(confirm('确定移除此题？对应历史评分会失效，不再计入总分。')){modalContext.model.questions=modalContext.model.questions.filter(q=>q.id!==id);drawBatchForm();modalDirty=true}}
else if(a==='reference-demo'){const target=$('#reference-preview');target.insertAdjacentHTML('beforeend','<div class="notice warn">模拟流程：图片已载入 → OCR 服务未接入 → 请人工对照图片，将真实答案录入对应题号。本次没有读取图片中的文字。</div>')}
else if(a==='upload-next'){if(closeDialog())navigate('ocr',id)}
else if(a==='retry-file'){const input=document.createElement('input');input.type='file';input.accept='.jpg,.jpeg,.png,.pdf';input.addEventListener('change',()=>{if(input.files[0])upload([input.files[0]],id)});input.click()}
else if(a==='ocr-open'){pageId='';navigate('ocr',id)}
else if(a==='grading-open')navigate('grading',id);
else if(a==='pdf-pages'){if(leaveView())openPdf(id)}
else if(a==='ocr-history')historyDialog('OCR / 归属修改历史',batch().pages.find(p=>p.id===id).history);
else if(a==='rubric-edit')openRubric(id);
else if(a==='rubric-history'){const r=state.rubrics.find(r=>r.id===id);historyDialog('评分标准版本历史',[...r.history,{...r,history:undefined,time:now(),action:'当前版本'}])}
else if(a==='rubric-toggle'){const r=state.rubrics.find(r=>r.id===id);r.active=!r.active;if(save()){render();toast(r.active?'已启用':'已停用；已绑定批次保留具体版本，新题目不能选择此标准')}}
else if(a==='run-grade'){if(leaveView()){viewDirty=false;runGrade()}}
else if(a==='rerun'){if(leaveView()){viewDirty=false;runGrade(id)}}
else if(a==='grade-select'){if(leaveView()){[studentId,questionId]=id.split('|');viewDirty=false;render()}}
else if(a==='grade-source'){if(leaveView()){pageId=pagesFor(batch(),id).find(p=>p.answers[questionId])?.id||pagesFor(batch(),id)[0]?.id;navigate('ocr')}}
else if(a==='grade-history')historyDialog('评分与复核历史',batch().grades[id]?.history||[]);
else if(a==='student-report')studentReport(id);
else if(a==='report-to-grade'){closeDialog(true);[studentId,questionId]=id.split('|');queueFilter='all';navigate('grading')}
}catch(error){console.error(error);toast('操作失败：'+error.message)}});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){login(e);return}if(!['class-form','batch-form','rubric-form','ocr-form','pdf-form','grade-form','settings-form'].includes(e.target.id))return;try{({ 'class-form':saveClass,'batch-form':saveBatch,'rubric-form':saveRubric,'ocr-form':saveOcr,'pdf-form':savePdf,'grade-form':saveGrade,'settings-form':e=>{e.preventDefault();const name=$('#teacher-name').value.trim();if(!name)return fail(e.target,[['teacher-name','请输入教师姓名']]);state.settings.teacher=name;if(save()){viewDirty=false;toast('教师配置已保存')}}}[e.target.id])(e)}catch(error){e.preventDefault();console.error(error);toast('保存失败：'+error.message)}});

else if(id==='reference-file'){const file=e.target.files[0],ctx=modalContext;if(!file)return;const err=await validFile(file,true);if(err){toast(err);e.target.value='';return}const key=uid();await blobStore('put',key,file);if(modalContext===ctx&&$('#dialog').open){ctx.model.referenceKey=key;modalDirty=true;previewReference(key)}}
else if(id==='upload-batch'){modalContext.id=e.target.value;batchId=e.target.value;renderUploadResults()}
else if(id==='upload-files')await upload([...e.target.files]);
else if(id==='ocr-page'){const requested=e.target.value;if(leaveView()){viewDirty=false;pageId=requested;render()}else e.target.value=pageId}
else if(id==='grade-batch'||id==='report-batch'){const requested=e.target.value;if(leaveView()){viewDirty=false;batchId=requested;studentId='';questionId='';render()}else e.target.value=batchId}
else if(id==='queue-filter'){if(leaveView()){viewDirty=false;queueFilter=e.target.value;render()}else e.target.value=queueFilter}
else if(id==='report-mode'){reportMode=e.target.value;render()}
}catch(error){console.error(error);toast('操作失败：'+error.message)}});
$('#global-search').addEventListener('keydown',e=>{if(e.key==='Enter'){search=e.target.value.trim();statusFilter='';subjectFilter='';navigate('assignments')}});
$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
window.addEventListener('beforeunload',e=>{if(viewDirty||modalDirty||uploadBusy){e.preventDefault();e.returnValue=''}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){loadBroken=true;$('#storage-error').hidden=false;$('#storage-error').textContent='另一个标签页修改了记录。已停止本页保存以防覆盖，请先复制未保存文字，再刷新本页。'}});
state.batches.forEach(b=>b.files.forEach(f=>{if(f.status==='saving'){f.status='failed';f.error='上次保存中断，请重新选择文件重试'}}));
try{const nav=JSON.parse(sessionStorage.getItem('pixiaozhi.navigation')||'null');if(nav&&state.batches.some(b=>b.id===nav.batchId)){batchId=nav.batchId;pageId=nav.pageId||'';studentId=nav.studentId||'';questionId=nav.questionId||'';reportMode=nav.reportMode==='ai'?'ai':'reviewed';if(routes[nav.page]||nav.page==='ocr')page=nav.page}}catch(e){}const requested=location.hash.slice(1);if(routes[requested]||requested==='ocr')page=requested;if(!batchId)batchId=state.batches[0]?.id||'';if(isLoggedIn()){document.body.classList.remove('is-locked');$('#login-screen').hidden=true;render()}else showLogin();
